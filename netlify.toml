[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirige el subdominio netlify.app al dominio principal (.com.mx).
# Reemplaza "evi" por el subdominio exacto que te asigna Netlify si es distinto.
[[redirects]]
  from = "https://educacionparalavida.netlify.app/*"
  to = "https://educacionparalavida.com.mx/:splat"
  status = 301
  force = true

# Caché larga para imágenes y fuentes (nombres versionados/hash)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"